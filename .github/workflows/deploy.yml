name: Build & deploy

# main  -> deploy portal + admin to the staging Workers, push Supabase changes
# PRs   -> build only (no secrets needed)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://gnnabvwdlpsxmdgvthpi.supabase.co
  # publishable key is designed to be public (RLS protects the data)
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EG2_UYY58zhY3zOrf8rSXw_JDCrvdr7
  # Broadland Digital CRM postcode lookup (browser key: public by design, locked to our domains)
  NEXT_PUBLIC_POSTCODE_LOOKUP_KEY: ${{ vars.POSTCODE_LOOKUP_KEY }}

jobs:
  apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [portal, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set; skipping deploy"
            exit 0
          fi
          npx wrangler deploy

  supabase:
    name: supabase
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Session pooler connection string (Dashboard -> Connect -> Session pooler).
      # GitHub runners have no IPv6, so the direct db.<ref>.supabase.co host is unreachable.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PROJECT_REF: gnnabvwdlpsxmdgvthpi
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Push migrations & deploy functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set; skipping Supabase deploy"
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase functions deploy --remote="$PROJECT_REF" --yes
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL not set; skipping migrations (apply them from the dashboard or add the secret)"
          else
            supabase db push --db-url "$SUPABASE_DB_URL" --yes
          fi
