name: Diagnose product images
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe image sources
        run: |
          probe() { printf '%s  %s\n' "$(curl -s -o /tmp/b -w '%{http_code} %{content_type} %{size_download}B redirect=%{redirect_url}' -m 25 -A 'Mozilla/5.0' "$1")" "$1"; }
          P=https://cpr-images.justin-b8f.workers.dev/?url=
          for u in \
            "https://www.toppstiles.co.uk/static/media/catalog/product/7/1/716168.jpg" \
            "https://d1vtn7wn5g2dql.cloudfront.net/images/Products/Hero%20Images/08%20Cambridge%20Midnight%20TH%20(MAIN)%20V6%20(FLAT).png" \
            "https://dbeqa0uxcurjo.cloudfront.net/images/Products/Hero%20Images/11%208%20TH%20Richmond%20Pebble%20Grey%20V5%20(FLAT).png" ; do
            echo "== proxy"; probe "$P$u"; echo "== direct"; probe "$u"
          done
          echo "== eastbrook old image (http, https)"
          probe "http://www.eastbrooktrade.com/product/image/large/41.1019_0.jpg"
          probe "https://www.eastbrooktrade.com/product/image/large/41.1019_0.jpg"
          echo "== eastbrook product page -> look for its image URLs"
          curl -sL -m 30 -A 'Mozilla/5.0' -o /tmp/p -w 'final=%{url_effective} code=%{http_code}\n' "http://www.eastbrooktrade.com/en-gb/heating/heating__traditional-range/heating__traditional-range__stour/stour-1195-x-600-chrome-41_1019"
          grep -oiE '(https?:)?//[^"'"'"' )]+\.(jpe?g|png|webp)[^"'"'"' )]*' /tmp/p | sort -u | head -15
          echo "== eastbrook search for sku"
          curl -sL -m 30 -A 'Mozilla/5.0' -o /tmp/s -w 'final=%{url_effective} code=%{http_code}\n' "https://www.eastbrooktrade.com/search?q=41.1019"
          grep -oiE '(https?:)?//[^"'"'"' )]+\.(jpe?g|png|webp)[^"'"'"' )]*' /tmp/s | grep -i "41" | sort -u | head -10
