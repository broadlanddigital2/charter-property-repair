name: Diagnose product images
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Eastbrooke site
        run: |
          UA='Mozilla/5.0 (compatible; CPR-catalogue-sync/1.0)'
          echo "== robots.txt"; curl -s -m 20 -A "$UA" https://www.eastbrooktrade.com/robots.txt | head -40
          echo "== product page (via sku search)"
          curl -sL -m 30 -A "$UA" -o /tmp/p -w 'final=%{url_effective} code=%{http_code} size=%{size_download}\n' "https://www.eastbrooktrade.com/search?q=41.1019"
          echo "-- og:image / json-ld image / img tags"
          grep -oiE '<meta[^>]+og:image[^>]*>' /tmp/p | head -5
          grep -oiE '"image"\s*:\s*(\[[^]]{0,400}\]|"[^"]+")' /tmp/p | head -5
          grep -oiE '<img[^>]+>' /tmp/p | grep -viE 'logo|icon|svg|payment|flag' | head -12
          grep -oiE '(src|data-src|srcset|href)="[^"]*(product|media|catalog|image)[^"]*"' /tmp/p | sort -u | head -20
          echo "== sitemap index"
          curl -s -m 20 -A "$UA" https://www.eastbrooktrade.com/sitemap.xml | head -c 1500; echo
